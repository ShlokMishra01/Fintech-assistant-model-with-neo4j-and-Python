  <path d="M450 465C490 505 540 525 590 560" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M850 465C820 505 760 525 710 560" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" fill="none"/>
