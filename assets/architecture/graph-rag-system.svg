    <text x="690" y="408" fill="#C4B5FD" font-size="18" font-family="Segoe UI, sans-serif">Explains what the numbers mean</text>
    <text x="690" y="436" fill="#C4B5FD" font-size="18" font-family="Segoe UI, sans-serif">and what the user should do next</text>
  </g>

  <g filter="url(#shadow)">
