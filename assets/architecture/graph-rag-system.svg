    <text x="352" y="372" fill="#F8FAFC" font-size="26" font-weight="700" font-family="Segoe UI, sans-serif">Verified Metrics</text>
    <text x="330" y="408" fill="#A5F3FC" font-size="18" font-family="Segoe UI, sans-serif">Debt burden</text>
    <text x="330" y="436" fill="#A5F3FC" font-size="18" font-family="Segoe UI, sans-serif">Emergency fund gap</text>
  </g>

  <g filter="url(#shadow)">
