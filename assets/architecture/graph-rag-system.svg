    <text x="592" y="612" fill="#F8FAFC" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">Decision Support</text>
    <text x="612" y="646" fill="#86EFAC" font-size="18" font-family="Segoe UI, sans-serif">Affordability, safety, runway</text>
  </g>

  <path d="M450 225V315" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M850 225V315" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 465L590 560" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
