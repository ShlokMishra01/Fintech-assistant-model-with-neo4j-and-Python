<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="200" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071522"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1270" cy="110" r="180" fill="#0B2235" opacity="0.8"/>
  <circle cx="180" cy="650" r="220" fill="#0B1220" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect x="110" y="105" width="220" height="120" rx="20" fill="#0B172A" stroke="#1F2A39"/>
    <text x="152" y="150" fill="#F8FAFC" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">User</text>
    <text x="136" y="182" fill="#7DD3FC" font-size="17" font-family="Segoe UI, sans-serif">Income, goals, debt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="105" width="280" height="120" rx="20" fill="#0B172A" stroke="#1F2A39"/>
    <text x="430" y="150" fill="#F8FAFC" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">Neo4j Graph</text>
    <text x="418" y="182" fill="#7DD3FC" font-size="17" font-family="Segoe UI, sans-serif">Accounts, holdings, EMI, cashflow</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="730" y="105" width="240" height="120" rx="20" fill="#0B172A" stroke="#1F2A39"/>
    <text x="780" y="150" fill="#F8FAFC" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">GraphRAG</text>
    <text x="768" y="182" fill="#7DD3FC" font-size="17" font-family="Segoe UI, sans-serif">Relevant sub-graph</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="105" width="260" height="120" rx="20" fill="#0B172A" stroke="#1F2A39"/>
    <text x="1046" y="150" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, sans-serif">Financial Engine</text>
    <text x="1060" y="182" fill="#7DD3FC" font-size="17" font-family="Segoe UI, sans-serif">Runway, savings, health, safety</text>
  </g>

  <path d="M330 165H390" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M670 165H730" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M970 165H1010" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

